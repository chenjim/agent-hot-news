# Agent Hot News 前端：静态资源 + /api 反代到 backend
# 容器内监听 3000（compose 映射 51131:3000），公网经 en nginx -> frpc 隧道进来

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩：en 外层也会压，这里先压可省隧道流量；上游已带 Content-Encoding 时外层直接透传
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ---- 后端 API（含 SSE）----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/api/v1/sse/hot-events 每 30s 推一次）不能缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查（与原 hotnews.conf 行为一致）
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 带指纹的静态资源：永久缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 其余静态文件（favicon 等）----
    location ~* \.(svg|png|jpg|jpeg|ico|webp|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- SPA：路由回退到 index.html，本身不缓存 ----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
