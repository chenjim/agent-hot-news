services:
  redis:
    image: redis:7-alpine
    container_name: hotnews-redis
    ports:
      - "51179:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    container_name: hotnews-postgres
    ports:
      - "51132:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: hotnews
      POSTGRES_PASSWORD: hotnews
      POSTGRES_DB: hotnews
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotnews -d hotnews"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotnews-frontend
    ports:
      - "51131:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/v1

volumes:
  redis_data:
  pgdata:
